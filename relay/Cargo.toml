[package]
name = "gamepath-relay"
version = "0.1.0"
edition = "2024"
description = "Authenticated multipath relay for GamePath"

[dependencies]
clap = { version = "4", features = ["derive"] }
gamepath-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tun-rs = "2.8.9"

