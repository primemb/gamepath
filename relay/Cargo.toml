[package]
name = "gamepath-relay"
version = "0.1.0"
edition = "2024"
# The relay is compiled on its own host, and deploy/install-relay.sh pins the
# toolchain there for distros that ship an older Rust. Nothing here may use a
# language feature or std API newer than this.
rust-version = "1.85"
description = "Authenticated multipath relay for GamePath"

[dependencies]
clap = { version = "4", features = ["derive"] }
# The relay only needs the frame, auth and session types, so it opts out of
# the client-only OpenVPN feature and the TLS stack that comes with it.
gamepath-engine = { path = "../engine", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tun-rs = "2.8.9"

