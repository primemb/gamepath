[package]
name = "gamepath-service"
version = "0.1.0"
edition = "2024"
# The relay is compiled on its own host, and deploy/install-relay.sh pins the
# toolchain there for distros that ship an older Rust. Nothing here may use a
# language feature or std API newer than this.
rust-version = "1.85"
description = "Privileged Windows network service for GamePath"

[dependencies]
gamepath-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
