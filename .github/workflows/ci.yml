name: CI and release

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Windows client
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/validate-release-tag.cjs
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - run: rustup default stable
      - run: npm ci
      - name: Validate client and build native components
        run: npm run check
      - name: Test engine
        run: cargo test --locked --manifest-path engine/Cargo.toml
      - name: Test service
        run: cargo test --locked --manifest-path service/Cargo.toml
      - name: Build optimized native components
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run native:release
      - name: Package Windows x64 installer
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/package-windows.cjs
      - name: Generate checksum
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/GamePath-Setup-$version.exe"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: windows-installer
          path: |
            release/GamePath-Setup-*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  relay:
    name: Linux relay
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - run: rustup default stable
      - run: cargo test --locked --manifest-path relay/Cargo.toml
      - run: cargo build --locked --release --manifest-path relay/Cargo.toml

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [windows, relay]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: Publish installer and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/*.exe release/SHA256SUMS.txt \
            --verify-tag --generate-notes --title "GamePath $RELEASE_TAG" "${flags[@]}"
