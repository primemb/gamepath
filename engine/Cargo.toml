[package]
name = "gamepath-engine"
version = "0.1.0"
edition = "2024"
description = "Native multipath packet engine for the GamePath Windows client"

[lib]
name = "gamepath_engine"
path = "src/lib.rs"

[[bin]]
name = "gamepath-engine"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
boringtun = "0.7.1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
wintun = "0.5.1"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
