[package]
name = "gamepath-engine"
version = "0.1.0"
edition = "2024"
description = "Native multipath packet engine for the GamePath Windows client"

[lib]
name = "gamepath_engine"
path = "src/lib.rs"

[[bin]]
name = "gamepath-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wintun = "0.5.1"
